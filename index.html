<style>
  :root{
    --green:#6c8cff; --green-soft:#eaefff; --green-deep:#3f5bd9;
    --pink:#ec4899; --pink-soft:#fce7f3; --pink-deep:#be185d;
    --warm1:#fbbf24; --warm2:#fde68a; --warm3:#86efac;
    --bg:#f7f7fb; --surface:#ffffff; --text:#181a2a; --muted:#6b6f8a;
    --line:#e6e6f0; --shadow:0 10px 30px rgba(108,140,255,.12);
    --radius:20px;
  }
  html[data-theme="dark"]{
    --green:#93a7ff; --green-soft:#1c2150; --green-deep:#7c93ff;
    --pink:#f9a8d4; --pink-soft:#3a1830; --pink-deep:#f472b6;
    --warm1:#b45309; --warm2:#78350f; --warm3:#14532d;
    --bg:#0f0f1a; --surface:#181a2e; --text:#eceefb; --muted:#9a9dc0;
    --line:#22302a; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse 700px 500px at 15% -5%,rgba(251,191,36,.20),transparent 60%),
    radial-gradient(ellipse 600px 500px at 100% 30%,rgba(134,239,172,.16),transparent 60%),var(--bg);color:var(--text);
    position:relative;overflow-x:hidden;
    font-family:ui-rounded,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:92px;
    padding-top:env(safe-area-inset-top,0px)}
  a{color:var(--green)}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  header.top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top,0px)}
  .topin{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
  .mono{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--pink));color:#fff;display:grid;place-items:center;
    animation:glow 3s ease-in-out infinite;
    font-family:Georgia,serif;font-size:22px;font-weight:700}
  .brand b{display:block;font-size:16px}
  .brand span{display:block;font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  h2{margin:0 0 4px;font-size:20px}
  h3{margin:0 0 10px;font-size:15px;color:var(--pink-deep);font-weight:700;letter-spacing:.02em}
  html[data-theme="dark"] h3{color:var(--pink)}
  p.small,.small{font-size:13px;color:var(--muted);margin:4px 0}
  .obdots{display:flex;gap:6px;margin-top:10px}
  .obdot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .2s}
  .obdot.on{background:var(--green)}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--text);
    border-radius:14px;padding:12px 16px;min-height:46px;transition:transform .12s ease,border-color .15s ease}
  .btn:hover{border-color:var(--green)}
  .btn.primary{background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;border-color:var(--green)}
  .btn.ghost{background:transparent}
  .btn.sm{min-height:36px;padding:7px 12px;border-radius:11px;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .page-head{margin:4px 2px 14px;animation:cardIn .35s ease both}
  .page-head h1{margin:0;font-size:clamp(22px,4vw,30px);line-height:1.15}
  .page-head p{margin:4px 0 0;opacity:.65;font-size:14px}
  .card h2,.card h3{margin-top:0}
  .card details summary{cursor:pointer;padding:6px 0}
  .card ol{padding-left:20px;margin:6px 0}
  .card ol li{margin:4px 0}
  input,select,textarea{font:inherit;color:var(--text);background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px;width:100%}
  textarea{min-height:80px}
  label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .grid{display:grid;gap:16px}
  @media(min-width:760px){ .grid.two{grid-template-columns:1fr 1fr} .grid.three{grid-template-columns:repeat(3,1fr)} }
  @media(min-width:1000px){ body{padding-bottom:24px} }
  /* nav */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
    border-top:1px solid var(--line);display:flex;padding:6px 2px calc(4px + env(safe-area-inset-bottom))}
  nav.bottom button{flex:1;border:0;background:none;color:var(--muted);padding:8px 1px;
    display:grid;gap:2px;justify-items:center;font-size:10px;border-radius:12px}
  nav.bottom button.on{color:var(--green);background:var(--green-soft)}
  nav.bottom svg{width:22px;height:22px}
  nav.side{display:none}
  @media(min-width:1000px){
    nav.bottom{display:none}
    nav.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:86px;align-self:start}
    nav.side button{border:0;background:none;color:var(--muted);text-align:left;padding:11px 14px;border-radius:13px;display:flex;gap:10px;align-items:center}
    nav.side button.on{color:var(--green);background:var(--green-soft);font-weight:600}
    .shell{display:grid;grid-template-columns:210px 1fr;gap:22px;max-width:1100px;margin:0 auto;padding:16px}
  }
  /* habit */
  .habit{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);
    border-radius:16px;margin-bottom:10px;background:var(--surface)}
  .tick{width:46px;height:46px;min-width:46px;border-radius:50%;border:2px solid var(--line);
    background:transparent;display:grid;place-items:center;font-size:20px;color:var(--muted);transition:transform .15s ease}
  .tick.done{background:var(--green);border-color:var(--green);color:#fff;animation:pop .3s ease}
  .hname{font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11px;background:var(--pink-soft);color:var(--pink-deep);padding:3px 9px;border-radius:999px}
  html[data-theme="dark"] .chip{color:var(--pink)}
  .dots{display:flex;gap:4px;margin-top:8px}
  .dot{width:16px;height:16px;border-radius:5px;background:var(--line)}
  .dot.d{background:var(--green)}
  .dot.s{background:#f2c14e}
  .ring{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;margin:0 auto;transition:background 1s ease}
  .ring .inner{width:116px;height:116px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
  .ring b{font-size:28px;display:block}
  .bars{display:flex;gap:8px;align-items:flex-end;height:80px;margin-top:8px}
  .bars div{flex:1;background:var(--green-soft);border-radius:8px 8px 4px 4px;position:relative}
  .bars div i{position:absolute;bottom:0;left:0;right:0;background:var(--green);border-radius:8px 8px 4px 4px;display:block;transition:height .5s ease}
  .bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .heat div{aspect-ratio:1;border-radius:6px;background:var(--line);font-size:9px;color:var(--muted);display:grid;place-items:center}
  .bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .5s ease}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:60;background:var(--green);
    color:#fff;padding:12px 18px;border-radius:14px;box-shadow:var(--shadow);max-width:90%;text-align:center;
    animation:rise .25s ease}
  .list{max-height:320px;overflow:auto}
  .item{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .hide{display:none!important}
  footer{padding:24px 16px 40px;text-align:center;color:var(--muted);font-size:12px}
  .switch{display:flex;gap:8px;flex-wrap:wrap}
  .switch button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 14px;font-size:13px}
  .switch button.on{background:var(--green);border-color:var(--green);color:#fff}
  .btn.sm.on{background:var(--green);border-color:var(--green);color:#fff}
  dialog{border:0;border-radius:20px;padding:0;max-width:520px;width:92%;background:var(--surface);color:var(--text)}
  dialog::backdrop{background:rgba(6,20,13,.5)}
  .dlg{padding:20px}
  /* mascot / level */
  .mascot{font-size:42px;line-height:1;animation:float 3s ease-in-out infinite}
  .level-pill{display:inline-block;background:var(--pink-soft);color:var(--pink-deep);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
  html[data-theme="dark"] .level-pill{color:var(--pink)}
  .xpbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--pink));transition:width .6s ease}
  /* badges */
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  .badge{border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;background:var(--surface)}
  .badge.locked{opacity:.35}
  .badge .ic{font-size:26px}
  /* verse */
  .verse-card{background:linear-gradient(135deg,var(--green-soft),var(--pink-soft))}
  .verse-text{font-family:Georgia,serif;font-size:18px;line-height:1.55;font-style:italic;margin:8px 0}
  .vnum{font-size:11px;color:var(--muted);vertical-align:super;margin-right:3px}
  .loadbar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0;position:relative}
  .loadbar i{position:absolute;left:-30%;width:30%;height:100%;background:var(--green);animation:load 1.2s infinite}
  /* confetti */
  .confetti-piece{position:fixed;top:0;width:8px;height:14px;z-index:80;pointer-events:none;border-radius:2px;
    animation:fall linear forwards}
  @keyframes fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:.3}}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes rise{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  @keyframes load{0%{left:-30%}100%{left:100%}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.35)}50%{box-shadow:0 0 0 6px rgba(236,72,153,0)}}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-25px,-15px)}}
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:-1;pointer-events:none}
  body::before{width:300px;height:300px;top:-70px;left:-70px;background:var(--warm1);animation:drift1 9s ease-in-out infinite}
  body::after{width:260px;height:260px;bottom:60px;right:-60px;background:var(--warm3);animation:drift2 11s ease-in-out infinite}
  .card{animation:cardIn .35s ease both}
  .btn:active{transform:scale(.96)}
  .tick:active{transform:scale(.9)}
  nav.bottom button.on span, nav.side button.on span{animation:pop .3s ease}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  }

  /* ===== responsive + alive polish (added) ===== */
  html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{min-height:100vh;min-height:100dvh;background-attachment:fixed}
  :root{--border:var(--line)}
  img,svg,video,canvas{max-width:100%}
  h2,h3,.hname,.item,p{overflow-wrap:anywhere}
  .card{transition:transform .25s ease,box-shadow .25s ease}
  @media(hover:hover){ .card:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(108,140,255,.18)}
    .btn:hover{transform:translateY(-1px)} .habit:hover{border-color:var(--green)} }
  #main > .card:nth-child(2){animation-delay:.05s} #main > .card:nth-child(3){animation-delay:.1s}
  #main > .card:nth-child(4){animation-delay:.15s} #main > .card:nth-child(5){animation-delay:.2s}
  #main > .card:nth-child(n+6){animation-delay:.25s}
  .habit{transition:border-color .2s ease,background .3s ease,transform .2s ease;animation:cardIn .35s ease both}
  .habit:has(.tick.done){background:color-mix(in oklab,var(--green-soft) 55%,var(--surface))}
  .habit:has(.tick.done) .hname{opacity:.75}
  .tick.done{box-shadow:0 0 0 0 var(--green);animation:pop .3s ease,tickGlow .7s ease}
  @keyframes tickGlow{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--green) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
  .btn,.tick,nav.bottom button,nav.side button,.switch button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .btn.primary{box-shadow:0 6px 18px color-mix(in oklab,var(--green) 35%,transparent)}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom));width:max-content}
  dialog{max-height:88vh;overflow:auto}
  dialog[open]{animation:dlgIn .25s ease}
  @keyframes dlgIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .btn[disabled]{opacity:.6;pointer-events:none}
  /* phone: scrollable bottom menu, never squashed */
  nav.bottom{overflow-x:auto;scrollbar-width:none;box-shadow:0 -6px 20px rgba(0,0,0,.05)}
  nav.bottom::-webkit-scrollbar{display:none}
  nav.bottom button{min-width:58px;min-height:52px;transition:background .2s ease,color .2s ease}
  @media(max-width:420px){ .wrap{padding:12px} .card{padding:15px;border-radius:18px} .row > .btn{flex:1 1 auto}
    .brand b{font-size:15px} .ring{width:132px;height:132px} .ring .inner{width:102px;height:102px} }
  @media(max-width:340px){ .brand span{display:none} }
  /* tablet + laptop: dashboard of cards */
  @media(min-width:760px){
    #main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:16px;align-items:start}
    #main > *{margin-bottom:0;min-width:0}
    #main > .page-head,#main > footer,#main > .card:has(.habit),#main > .card:has(form),#main > .card:has(.heat),#main > .card:has(.badge-grid),#main > .card:has(.list){grid-column:1/-1}
    nav.bottom button{font-size:11px}
  }
  @media(min-width:1000px){ .shell{max-width:1240px;grid-template-columns:210px minmax(0,1fr)} .shell > main{min-width:0;max-width:none;width:100%;padding:0} .topin{max-width:1240px} nav.side button{transition:background .2s,color .2s,transform .15s} nav.side button:hover{transform:translateX(3px);color:var(--text)} }
  @media(min-width:1400px){ .shell{max-width:1360px;grid-template-columns:230px minmax(0,1fr)} }

  /* ===== friend features, celebrations, steps, welcome (build 15) ===== */
  .hero-card{background:linear-gradient(135deg,color-mix(in oklab,var(--green) 16%,var(--surface)),color-mix(in oklab,var(--pink) 14%,var(--surface)))}
  .wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease-in-out infinite}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
  .streak-pill{background:color-mix(in oklab,#f97316 18%,var(--surface));color:#ea580c}
  html[data-theme="dark"] .streak-pill{color:#fdba74}
  .mood-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  @media(min-width:520px){ .mood-row{grid-template-columns:repeat(6,1fr)} }
  .mood-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;transition:transform .15s ease,border-color .15s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .mood-btn span{font-size:28px;line-height:1}
  .mood-btn:active{transform:scale(.92)} .mood-btn:hover{border-color:var(--pink)}
  .mood-done{animation:cardIn .35s ease both}
  .mood-big{font-size:40px;line-height:1;margin-right:12px;animation:pop .45s ease}
  .affirm-card{position:relative;overflow:hidden;background:linear-gradient(120deg,color-mix(in oklab,var(--pink) 22%,var(--surface)),color-mix(in oklab,var(--green) 22%,var(--surface)),color-mix(in oklab,var(--pink) 22%,var(--surface)));
    background-size:220% 220%;animation:cardIn .35s ease both,shimmer 8s ease infinite}
  @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .affirm-text{font-size:21px;font-weight:700;line-height:1.35;margin:6px 0 8px;letter-spacing:-.01em}
  .affirm-card.said .affirm-text::after{content:" ✓";color:var(--green)}
  .celebrate{text-align:center;padding:26px 20px 22px}
  .celebrate h2{margin:8px 0 6px} .celebrate p{color:var(--muted);margin:0 0 16px;line-height:1.5}
  .cele-emoji{font-size:64px;line-height:1;animation:celePop .7s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes celePop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .walk-card.on{border-color:var(--pink);box-shadow:0 0 0 3px color-mix(in oklab,var(--pink) 25%,transparent)}
  .walk-live{font-size:16px;display:flex;align-items:center;gap:8px}
  .pulse{width:12px;height:12px;border-radius:50%;background:var(--pink);display:inline-block;animation:pulse 1.2s ease infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--pink) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
  .sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sum-grid > div{background:color-mix(in oklab,var(--green) 8%,var(--surface));border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
  .sum-grid b{display:block;font-size:18px} .sum-grid span{font-size:11px;color:var(--muted);line-height:1.3;display:block}
  .welcome-hero{text-align:center;padding:18px 6px 8px}
  .welcome-logo{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;display:grid;place-items:center;font:800 40px/1 Georgia,serif;color:#fff;
    background:linear-gradient(135deg,var(--green),var(--pink));box-shadow:0 14px 36px color-mix(in oklab,var(--pink) 40%,transparent);animation:float 3s ease-in-out infinite}
  .welcome-hero h1{font-size:clamp(24px,6vw,34px);line-height:1.15;margin:0 0 10px;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--green),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}

"use strict";
/* ---------- storage (everything lives on this device only, nothing is sent anywhere) ---------- */

var DEFAULTS={
  name:"", theme:"system", accent:"green",
  habits:[], done:{}, skips:{}, counts:{},
  water:{}, waterUnit:"glasses", waterGoal:8,

};
var S = load();
function load(){
  try{ var raw=localStorage.getItem(KEY);
    if(!raw){
      var old=localStorage.getItem("ese.habit.tracker.v1");
      if(old){ var o2=JSON.parse(old); for(var k in DEFAULTS){ if(!(k in o2)) o2[k]=DEFAULTS[k]; } return o2; }
      return JSON.parse(JSON.stringify(DEFAULTS));
    }
    var o=JSON.parse(raw); for(var k2 in DEFAULTS){ if(!(k2 in o)) o[k2]=DEFAULTS[k2]; } return o;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function saveLocal(){ localStorage.setItem(KEY, JSON.stringify(S)); }
/* ---------- alarms on the phone, even when the app is closed ----------
   The phone registers with Firebase Cloud Messaging. A tiny server program runs every
   minute and sends a short code (like "daily" or "h:abc123") to phones with an alarm due.
   The server only knows TIMES and codes, never habit names: the phone itself turns the
   code into the words you see, using text saved privately on the phone. */
var FCM_VAPID_KEY="BEm6bLukb_TizT-JxO8pzXvEAAWWue65h3-msTc2W0jbB2lBn0GD45IZLBim67aXXHtBHxI1yxl2QCYNThcwxCg";
var PUSH_ACTIVE=false, pushTimer=null, lastPushPlan="";
function pushConfigured(){ return fbReady() && FCM_VAPID_KEY.indexOf("PASTE")<0 && !!(window.firebase && firebase.messaging) &&
  ("serviceWorker" in navigator) && ("Notification" in window) && ("PushManager" in window); }
function idbOpen(){ return new Promise(function(res,rej){ var r=indexedDB.open("ese-push",1);
  r.onupgradeneeded=function(){ r.result.createObjectStore("kv"); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
function idbSet(k,v){ return idbOpen().then(function(db){ return new Promise(function(res){ var tx=db.transaction("kv","readwrite");
  tx.objectStore("kv").put(v,k); tx.oncomplete=function(){ res(); }; tx.onerror=function(){ res(); }; }); }).catch(function(){}); }
function localToUtcMin(hhmm){ var p=String(hhmm||"").split(":"); if(p.length<2||isNaN(+p[0])||isNaN(+p[1])) return null;
  var d=new Date(); d.setHours(+p[0],+p[1],0,0); return d.getUTCHours()*60+d.getUTCMinutes(); }
function minusHour(hhmm){ var p=hhmm.split(":"), t=((+p[0])*60+(+p[1])-60+1440)%1440; return ("0"+Math.floor(t/60)).slice(-2)+":"+("0"+t%60).slice(-2); }
function buildPushPlan(){
  var slots={}, texts={}, nm=S.name? ", "+S.name : "";
  function add(hhmm,tag,title,body){ var m=localToUtcMin(hhmm); if(m===null) return; var k=String(m);
    slots[k]=slots[k]||[]; if(slots[k].indexOf(tag)<0 && slots[k].length<10) slots[k].push(tag); texts[tag]={title:title,body:body}; }
  if(S.reminders){
    add(S.reminderTime||"08:00","daily","Good day"+nm+" ☀️","Your declarations and verse for today are ready.");
    add("19:30","evening","A gentle nudge"+nm,"Still time for one habit today. "+pick(PUSH));
    if(S.showSteps!==false) add("18:00","steps","👟 Step check"+nm,"A short walk gets you closer to your step goal.");
    activeHabits().forEach(function(h){ if(!h.time) return;
      add(minusHour(h.time),"p:"+h.id,"⏰ Coming up in an hour",h.name);
      add(h.time,"h:"+h.id,"⏰ Time for: "+h.name,"Your friendly nudge"+nm+". You've got this."); });
  }
  var mins=Object.keys(slots).map(Number).slice(0,80), slots2={};
  mins.forEach(function(m){ slots2[String(m)]=slots[String(m)]; });
  var daily={};
  for(var i=0;i<7;i++){ var d=addDays(today(),i); var decl=(S.myDecl&&S.myDecl.length)? S.myDecl[0] : todaysAffirmations(d)[0];
    var hr=+(S.reminderTime||"08:00").split(":")[0];
    daily[d]={title:(hr<12?"Good morning":hr<17?"Good afternoon":"Good evening")+nm+" ☀️", body:"🗣️ Today's declaration: "+decl+" Open the app for your verse."}; }
  return {mins:mins, slots:slots2, texts:texts, daily:daily};
}
function pushStatus(){
  var p=dayProgress(today());
  return idbSet("status",{date:today(),done:p.done,total:p.total,steps:stepsToday(),goal:S.stepGoal||8000,name:S.name||""});
}
function syncPush(force){
  if(!pushConfigured() || !fbUser || !fbDb || Notification.permission!=="granted") return Promise.resolve(false);
  var plan=buildPushPlan();
  idbSet("texts",plan.texts); idbSet("daily",plan.daily); pushStatus();
  return navigator.serviceWorker.ready.then(function(reg){
    return firebase.messaging().getToken({vapidKey:FCM_VAPID_KEY, serviceWorkerRegistration:reg});
  }).then(function(token){
    if(!token) return false;
    try{ localStorage.setItem("ese.pushToken",token); }catch(e){}
    var sig=token+"|"+JSON.stringify(plan.slots);
    if(!force && sig===lastPushPlan){ PUSH_ACTIVE=true; return true; }
    var ref=fbDb.collection("push").doc(fbUser.uid);
    return ref.get().then(function(doc){
      var toks=((doc.exists && doc.data().tokens)||[]).filter(function(t){ return t!==token; });
      toks.push(token); toks=toks.slice(-5);
      return ref.set({tokens:toks, mins:plan.mins, slots:plan.slots, updatedAt:new Date().toISOString()});
    }).then(function(){ lastPushPlan=sig; PUSH_ACTIVE=true; return true; });
  }).catch(function(){ return false; });
}
function syncPushSoon(){ clearTimeout(pushTimer); pushTimer=setTimeout(function(){ syncPush(false); },3000); }
function unregisterPush(){
  var token=null; try{ token=localStorage.getItem("ese.pushToken"); localStorage.removeItem("ese.pushToken"); }catch(e){}
  PUSH_ACTIVE=false; lastPushPlan="";
  if(!pushConfigured() || !fbUser || !fbDb || !token) return Promise.resolve();
  return fbDb.collection("push").doc(fbUser.uid).update({tokens:firebase.firestore.FieldValue.arrayRemove(token)})
    .catch(function(){}).then(function(){ return firebase.messaging().deleteToken().catch(function(){}); });
}

/* ---------- privacy: end-to-end encryption ----------
   Each person's habits, moods, declarations, steps, etc. are encrypted ON THEIR OWN DEVICE
   with a key made from their password (PBKDF2 + AES-256-GCM, built into every modern
   browser) before anything is sent to Firebase. Firebase, and the app admin, only ever
   see scrambled text. The key never leaves the person's device. */
var CRYPTO_KEY=null, CRYPTO_EMAIL="";
function hasCrypto(){ try{ return !!(window.crypto && crypto.subtle && window.TextEncoder); }catch(e){ return false; } }
function b64(buf){ var b=new Uint8Array(buf), s="", i; for(i=0;i<b.length;i+=8192){ s+=String.fromCharCode.apply(null,b.subarray(i,i+8192)); } return btoa(s); }
function unb64(str){ var s=atob(str), b=new Uint8Array(s.length); for(var i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }
function keySlot(email){ return "ese.k."+String(email||"").toLowerCase(); }
function deriveKey(email,pw){
  var enc=new TextEncoder(), em=String(email).toLowerCase();
  return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode("ese-habit-tracker:"+em),iterations:210000,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
  }).then(function(k){
    return crypto.subtle.exportKey("raw",k).then(function(raw){
      try{ localStorage.setItem(keySlot(em),b64(raw)); }catch(e){}
      CRYPTO_KEY=k; CRYPTO_EMAIL=em; return k; });
  });
}
function loadKey(email){
  var em=String(email||"").toLowerCase();
  if(CRYPTO_KEY && CRYPTO_EMAIL===em) return Promise.resolve(CRYPTO_KEY);
  if(!hasCrypto()) return Promise.resolve(null);
  var raw=null; try{ raw=localStorage.getItem(keySlot(em)); }catch(e){}
  if(!raw) return Promise.resolve(null);
  return crypto.subtle.importKey("raw",unb64(raw),{name:"AES-GCM"},false,["encrypt","decrypt"])
    .then(function(k){ CRYPTO_KEY=k; CRYPTO_EMAIL=em; return k; }).catch(function(){ return null; });
}
function forgetKey(email){ try{ localStorage.removeItem(keySlot(email)); }catch(e){} CRYPTO_KEY=null; CRYPTO_EMAIL=""; }
function encryptState(obj){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},CRYPTO_KEY,new TextEncoder().encode(JSON.stringify(obj)))
    .then(function(ct){ return {iv:b64(iv),ct:b64(ct)}; });
}
function decryptState(enc){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(enc.iv)},CRYPTO_KEY,unb64(enc.ct))
    .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
}
function cloudWrite(){
  if(!fbReady() || !fbUser || !fbDb || !CRYPTO_KEY) return Promise.resolve();
  var uid=fbUser.uid; S.ownerUid=uid;
  return encryptState(S).then(function(enc){
    return fbDb.collection("users").doc(uid).set({enc:enc,v:2,updatedAt:new Date().toISOString()});
  }).catch(function(){});
}
var cloudTimer=null;
function pushCloud(){
  if(!fbReady() || !fbUser || !fbDb) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(cloudWrite,900);
}
function save(){ saveLocal(); pushCloud(); if(pushConfigured()){ pushStatus(); if(fbUser) syncPushSoon(); } }

/* ---------- dates ---------- */
function iso(d){ d=d||new Date(); var m=d.getMonth()+1,day=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day; }
function addDays(s,n){ var d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function today(){ return iso(); }
function weekdayOf(s){ return new Date(s+"T12:00:00").getDay(); }
var DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function weekStart(date){ var wd=weekdayOf(date); var back=(wd===0)?6:(wd-1); return addDays(date,-back); }

/* ---------- habit helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function activeHabits(){ return S.habits.filter(function(h){return !h.archived;})
  .sort(function(a,b){return (a.order||0)-(b.order||0);}); }
function dueOn(h,date){
  if(h.archived) return false;
  if(h.start && date < h.start) return false;
  if(h.freq==="days") return (h.days||[]).indexOf(weekdayOf(date))>=0;
  return true; // daily and times-per-week both show every day; times-per-week is scored per week (see weekMet)
}
function isDone(h,date){
  var v=(S.done[h.id]||{})[date];
  if(h.target>1){ return ((S.counts[h.id]||{})[date]||0) >= h.target; }
  return !!v;
}
function isSkipped(h,date){ return !!(S.skips[h.id]||{})[date]; }

function weekDoneCount(h,ws){ var n=0; for(var i=0;i<7;i++){ if(isDone(h,addDays(ws,i))) n++; } return n; }
function weekMet(h,ws){ return weekDoneCount(h,ws) >= (h.perWeek||3); }
function isSatisfied(h,date){ return h.freq==="week" ? (isDone(h,date) || weekMet(h,weekStart(date))) : isDone(h,date); }

function setDone(h,date,val){
  var was=isDone(h,date);
  var prevLast=lastActiveDay();
  S.done[h.id]=S.done[h.id]||{};
  if(val) S.done[h.id][date]=true; else delete S.done[h.id][date];
  if(h.target>1){ S.counts[h.id]=S.counts[h.id]||{}; S.counts[h.id][date]= val? h.target : 0; }
  if(val && !was && date===today()) onFreshCompletion(prevLast);
  save();
}
function bump(h,date,by){
  var wasDone=isDone(h,date);
  var prevLast=lastActiveDay();
  S.counts[h.id]=S.counts[h.id]||{};
  var v=Math.max(0,(S.counts[h.id][date]||0)+by);
  S.counts[h.id][date]=v;
  S.done[h.id]=S.done[h.id]||{};
  if(v>=h.target) S.done[h.id][date]=true; else delete S.done[h.id][date];
  if(!wasDone && isDone(h,date) && date===today()) onFreshCompletion(prevLast);
  save();
}
function onFreshCompletion(prevLast){
  awardPoints(10);
  if(new Date().getHours()<7) S.hadEarlyBird=true;
  if(prevLast && prevLast<addDays(today(),-2)) S.hadComeback=true;
  var p=dayProgress(today());
  if(p.total>0 && p.done>=p.total && S.lastSweepDate!==today()){
    S.lastSweepDate=today(); S.cleanSweeps=(S.cleanSweeps||0)+1;
    celebrate("🎉","All done today"+(S.name?", "+S.name:"")+"!",pick(ALLDONE));
  }
  try{ if(navigator.vibrate) navigator.vibrate(30); }catch(e){}
}

function streak(h){
  if(h.freq==="week") return streakWeek(h);
  var n=0, d=today();
  if(!isDone(h,d) && !isSkipped(h,d)) d=addDays(d,-1);
  for(var i=0;i<1000;i++){
    if(!dueOn(h,d)){ d=addDays(d,-1); continue; }
    if(isDone(h,d)||isSkipped(h,d)){ if(isDone(h,d)) n++; d=addDays(d,-1); }
    else break;
  }
  return n;
}
function streakWeek(h){
  var w=weekStart(today());
  var n=weekMet(h,w)?1:0;
  w=addDays(w,-7);
  for(var i=0;i<520;i++){ if(weekMet(h,w)){ n++; w=addDays(w,-7); } else break; }
  return n;
}
function bestStreak(h){
  if(h.freq==="week") return bestStreakWeek(h);
  var dates=Object.keys(S.done[h.id]||{}).sort();
  if(!dates.length) return 0;
  var best=0,run=0,prev=null;
  for(var i=0;i<dates.length;i++){
    if(prev && dates[i]===addDays(prev,1)) run++; else run=1;
    if(run>best) best=run; prev=dates[i];
  }
  return best;
}
function bestStreakWeek(h){
  var dates=Object.keys(S.done[h.id]||{}).sort();
  if(!dates.length) return 0;
  var w=weekStart(dates[0]), end=weekStart(today());
  var best=0,run=0;
  for(var i=0;i<600 && w<=end;i++){
    if(weekMet(h,w)){ run++; if(run>best) best=run; } else run=0;
    w=addDays(w,7);
  }
  return best;
}
function rate(h,days){
  days=days||30;
  if(h.freq==="week") return rateWeek(h,days);
  var hit=0,tot=0,d=today();
  for(var i=0;i<days;i++){
    if(dueOn(h,d) && !isSkipped(h,d)){ tot++; if(isDone(h,d)) hit++; }
    d=addDays(d,-1);
  }
  return tot? Math.round(hit*100/tot) : 0;
}
function rateWeek(h,days){
  var weeks=Math.max(1,Math.round(days/7));
  var w=weekStart(today()); var hit=0,tot=0;
  for(var i=0;i<weeks;i++){ tot++; if(weekMet(h,w)) hit++; w=addDays(w,-7); }
  return tot? Math.round(hit*100/tot):0;
}
function dayProgress(date){
  var list=activeHabits().filter(function(h){return dueOn(h,date)&&!isSkipped(h,date);});
  var done=list.filter(function(h){return isSatisfied(h,date);}).length;
  return {done:done,total:list.length,pct: list.length? Math.round(done*100/list.length):0};
}

function badgeEarned(id){
  switch(id){
    case "first_step": return Object.keys(S.done).some(function(hid){ return Object.keys(S.done[hid]||{}).length>0; });
    case "streak7": return S.habits.some(function(h){ return bestStreak(h)>=7; });

    case "streak100": return S.habits.some(function(h){ return bestStreak(h)>=100; });
    case "water_champ": return waterGoalHits()>=7;
    case "mover": return S.exercise.length>=10;
    case "comeback": return !!S.hadComeback;
    case "tip_collector": return S.favTips.length>=10;
    case "verse_keeper": return (S.favVerses||[]).length>=5;
    case "clean_sweep": return (S.cleanSweeps||0)>=5;
    case "early_bird": return !!S.hadEarlyBird;

    case "mood7": return Object.keys(S.moods||{}).length>=7;
  }
  return false;

function loadCloudData(uid){

    var d=doc.exists? doc.data() : null;
    if(d && d.enc && CRYPTO_KEY) return decryptState(d.enc).then(function(st){ return {state:st}; }, function(){ return {failed:true}; });
    if(d && d.state) return {state:d.state, legacy:true};   /* older, unencrypted save: read once, then re-save encrypted */
    return {};
  }).then(function(r){
    if(r.state){
      var incoming=r.state, dev=S.deviceId;
      for(var k in DEFAULTS){ if(!(k in incoming)) incoming[k]=DEFAULTS[k]; }
      S=incoming; if(!S.deviceId) S.deviceId=dev; S.ownerUid=uid; saveLocal();
      if(r.legacy) pushCloudNow();
    } else {
      if(r.failed) toast("Your password was changed, so older cloud data couldn't be unlocked. Using what's on this phone.");
      if(S.ownerUid && S.ownerUid!==uid){ var dv=S.deviceId, th=S.theme; S=JSON.parse(JSON.stringify(DEFAULTS)); S.deviceId=dv; S.theme=th; }

       answering questions (obStep>0) — only redirect on a genuinely fresh load. */

function habitHTML(h,date,idx,total){

    var wc=weekDoneCount(h,weekStart(date));
    s+='<div class="chips"><span class="chip">🔥 '+st+' week'+(st===1?"":"s")+'</span>'+
       '<span class="chip">'+wc+' of '+(h.perWeek||3)+' this week</span>'+
       '<span class="chip">'+rate(h)+'% (12 wks)</span>'+
       '<span class="chip">'+freqLabel(h)+'</span>'+(h.time?'<span class="chip">⏰ '+h.time+'</span>':'')+'</div>';
  } else {

       '<span class="chip">'+freqLabel(h)+'</span>'+(h.time?'<span class="chip">⏰ '+h.time+'</span>':'')+'</div>';

  if(h.target>1){

  }
  s+='<div class="dots">';

/* ---------- steps ----------
   A website cannot read the phone's built-in step counter (Apple Health / Google Fit),
   so steps are logged by the person, plus an optional "walk mode" that counts steps
   with the phone's motion sensor while the app is open on screen. */
/* Phone step sync: the phone sends today's total from its health app by opening
   this site with ?steps=1234 (iPhone Shortcut / Android automation). Only the NEW steps since
   the last sync are added on top of what is already recorded in the app. The value waits
   safely on the phone until you are signed in, then syncs with your account. */
(function(){ try{ var q=new URLSearchParams(location.search), v=q.get("steps")||q.get("phonesteps");
  if(v!==null && /^\d{1,6}$/.test(v)){ localStorage.setItem("ese.pendingSteps",JSON.stringify({n:+v,d:iso(),at:Date.now()}));
    q.delete("steps"); q.delete("phonesteps"); var qs=q.toString();
    history.replaceState(null,"",location.pathname+(qs?"?"+qs:"")+location.hash); } }catch(e){} })();
function applyPhoneSteps(){
  if(typeof appPhase!=="undefined" && appPhase!=="app") return;
  if(!S.started) return;
  var p=null; try{ p=JSON.parse(localStorage.getItem("ese.pendingSteps")||"null"); }catch(e){}
  if(!p || p.d!==today()) { if(p) localStorage.removeItem("ese.pendingSteps"); return; }
  localStorage.removeItem("ese.pendingSteps");
  S.phoneSync=S.phoneSync||{}; var last=S.phoneSync[p.d]||0, add=p.n-last;
  S.phoneSync[p.d]=Math.max(last,p.n); S.phoneSyncAt=Date.now();
  if(add>0){ addSteps(add); toast("📱 Synced "+add.toLocaleString()+" steps from your phone"); render(); }
  else { save(); toast("📱 Phone steps already up to date"); }
}
function phoneSyncLink(){ return location.origin+location.pathname+"?steps="; }
function stepsToday(){ return (S.steps||{})[today()]||0; }
function addSteps(n){ S.steps=S.steps||{}; S.steps[today()]=Math.max(0,stepsToday()+n); save();
  var sg=S.stepGoal||8000;
  if(n>0 && stepsToday()>=sg && stepsToday()-n<sg) celebrate("👟","Step goal reached"+(S.name?", "+S.name:"")+"!",stepsToday().toLocaleString()+" steps today. Your heart thanks you.");
  checkBadges(); }
var walk={on:false,base:9.8,above:false,last:0,count:0,wake:null,got:false};
function onMotion(e){
  var a=e.accelerationIncludingGravity; if(!a||a.x===null||a.x===undefined) return;
  walk.got=true;
  var m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
  walk.base=walk.base*0.97+m*0.03;
  var d=m-walk.base, now=Date.now();
  if(!walk.above && d>1.3 && now-walk.last>280){ walk.above=true; walk.last=now; walkStep(); }
  else if(walk.above && d<0.3){ walk.above=false; }
}
function walkStep(){
  S.steps=S.steps||{}; S.steps[today()]=stepsToday()+1; walk.count++;
  var a=document.getElementById("walkCount"); if(a) a.textContent=walk.count.toLocaleString();
  var b=document.getElementById("stepsNum"); if(b) b.textContent=stepsToday().toLocaleString();
  var c=document.getElementById("todaySteps"); if(c) c.textContent=stepsToday().toLocaleString();
  if(walk.count%20===0) save();
}
function beginWalk(){
  walk.on=true; walk.count=0; walk.got=false; walk.base=9.8;
  window.addEventListener("devicemotion",onMotion);
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(l){ walk.wake=l; }).catch(function(){}); }catch(e){}
  render(); toast("Walk mode on. Keep this screen open while you walk.");
  setTimeout(function(){ if(walk.on && !walk.got){ stopWalk(true); toast("No motion sensor found on this device. You can add steps by hand instead."); } },3000);
}
function startWalk(){
  if(typeof DeviceMotionEvent==="undefined"){ toast("This device has no motion sensor. Add steps by hand instead."); return; }
  if(typeof DeviceMotionEvent.requestPermission==="function"){
    DeviceMotionEvent.requestPermission().then(function(r){ if(r==="granted") beginWalk(); else toast("Motion access was not allowed, so walk mode can't count steps."); })
      .catch(function(){ toast("Motion access was not allowed."); });
  } else beginWalk();
}
function stopWalk(silent){
  window.removeEventListener("devicemotion",onMotion);
  try{ if(walk.wake) walk.wake.release(); }catch(e){} walk.wake=null;
  var n=walk.count; walk.on=false; save(); checkBadges();
  if(!silent && n) toast("Walk saved: "+n.toLocaleString()+" steps 👏");
  render();
}

function weekStats(start){
  var r={done:0,total:0,best:null,bestPct:-1,steps:0,water:0,ex:0,moods:[],aff:0};
  for(var i=0;i<7;i++){ var d=addDays(start,i); if(d>today()) break; var p=dayProgress(d);
    r.done+=p.done; r.total+=p.total; if(p.total && p.pct>r.bestPct){ r.bestPct=p.pct; r.best=d; }
    r.steps+=(S.steps||{})[d]||0; if((S.water[d]||0)>=S.waterGoal) r.water++;
    if((S.affirmed||{})[d]) r.aff++; var mk=(S.moods||{})[d];
    r.moods.push(mk? (MOODS.filter(function(m){return m.k===mk;})[0]||{e:"·"}).e : "·"); }
  S.exercise.forEach(function(e){ if(e.date>=start && e.date<=addDays(start,6)) r.ex+=e.minutes; });
  r.pct=r.total? Math.round(r.done*100/r.total):0; return r;
}

function loadBible(){
  if(BIBLE || BIBLE_LOADING) return;
  BIBLE_LOADING=true;
  fetch("./bible-kjv.min.json").then(function(r){ if(!r.ok) throw new Error("bad response"); return r.json(); })
    .then(function(data){
      BIBLE=data; BIBLE.forEach(function(bk,i){ BIBLE_INDEX[bk.n]=i; });
      BIBLE_LOADING=false;
      if(tab==="verse"||tab==="today") render();
    })
    .catch(function(){
      BIBLE_LOADING=false;
      if(tab==="verse"){ toast("Could not load the Bible text. Connect once, then it works offline."); }
    });
}
function verseText(ref){
  var bi=BIBLE_INDEX[ref.b]; if(bi===undefined || !BIBLE) return "";
  var ch=BIBLE[bi].c[ref.c-1]||[]; return ch[ref.v-1]||"";
}
function chapterVerses(b,c){
  var bi=BIBLE_INDEX[b]; if(bi===undefined || !BIBLE) return [];
  return BIBLE[bi].c[c-1]||[];
}
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return h; }
var SESSION_VERSE=null;
function todaysVerseRef(){
  /* one verse per person per day: the same all day, a new one tomorrow */
  var rnd=seededRand(hashStr((S.deviceId||"x")+":verse:"+today()));
  return NOTABLE[Math.floor(rnd()*NOTABLE.length)];
}
function newVerse(){ var cur=SESSION_VERSE, n=0;
  do{ SESSION_VERSE=NOTABLE[Math.floor(Math.random()*NOTABLE.length)]; n++; }while(SESSION_VERSE===cur && n<10); }
function favVerseKey(ref){ return (S.favVerses||[]).some(function(v){return v.b===ref.b&&v.c===ref.c&&v.v===ref.v;}); }
function openChapter(ref){
  var verses=chapterVerses(ref.b,ref.c);
  if(!verses.length){ toast("That chapter could not be found."); return; }
  var rows=verses.map(function(txt,i){
    var n=i+1, hit=(n===ref.v);
    return '<p style="margin:0 0 10px"><span class="vnum">'+n+'</span>'+
      (hit? '<b style="background:var(--green-soft);padding:2px 4px;border-radius:6px">'+esc(txt)+'</b>' : esc(txt))+'</p>';
  }).join("");
  openDialog('<h2>'+esc(ref.b)+' '+ref.c+'</h2><div class="list" style="max-height:60vh">'+rows+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn primary" onclick="closeDialog()">Close</button></div>');
}

function render(){
  applyTheme();
  var m=document.getElementById("main");
  if(appPhase==="loading"){
    document.getElementById("bottomNav").innerHTML=""; document.getElementById("sideNav").innerHTML="";
    m.innerHTML=pageLoading(); return;
  }
  if(appPhase==="auth"){
    document.getElementById("bottomNav").innerHTML=""; document.getElementById("sideNav").innerHTML="";
    m.innerHTML=pageAuthGate(); wireAuthGate(); return;
  }
  if(tab==="onboard"){
    document.getElementById("bottomNav").innerHTML=""; document.getElementById("sideNav").innerHTML="";
    m.innerHTML=pageOnboard();
    m.insertAdjacentHTML("beforeend",
      '<footer>© '+new Date().getFullYear()+' Ekponbor Ese Laureta. Ese Daily Habit Tracker — all rights reserved. (build 15)</footer>');
    wire(); return;
  }
  drawNav();
  var PT={today:["Today","Your day at a glance"],add:["Add a habit","Pick from ideas or write your own"],progress:["Progress","Streaks, calendar and summaries"],
    water:["Water","Sip by sip through the day"],steps:["Steps","Count, add or sync from your phone"],move:["Exercise","Log movement and your weekly goal"],
    verse:["Verse","Today's word for you"],tips:["Health tips","Small daily wellness ideas"],admin:["Admin","Usage and messages"],settings:["Settings","Make it yours"]}[tab]||["",""];
  m.innerHTML = (PT[0]?'<div class="page-head"><h1>'+PT[0]+'</h1><p>'+PT[1]+'</p></div>':'') + (tab==="today"?pageToday(): tab==="add"?pageAdd(): tab==="progress"?pageProgress():
                tab==="water"?pageWater(): tab==="steps"?pageSteps(): tab==="move"?pageMove(): tab==="verse"?pageVerse():
                tab==="tips"?pageTips(): tab==="admin"?pageAdmin(): pageSettings());
  m.insertAdjacentHTML("beforeend",
    '<footer>© '+new Date().getFullYear()+' Ekponbor Ese Laureta. Ese Daily Habit Tracker — all rights reserved. (build 15)</footer>');
  wire();
  if(!window._stepsSyncing){ window._stepsSyncing=true; setTimeout(function(){ applyPhoneSteps(); window._stepsSyncing=false; },800); }
  checkMilestones();
  if(tab==="today" && !window._weekChecked){ window._weekChecked=true; setTimeout(maybeShowWeeklySummary,1200); }
}

    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    var custom=(obData.custom||"").split(",").map(function(s){return s.trim();}).filter(Boolean);
    var chosen=pool.slice(0,Math.max(0,obData.count-custom.length));
    custom.forEach(function(nm){ chosen.push({name:nm,icon:"⭐"}); });
    if(!chosen.length){ STARTERS.forEach(function(s){ addHabit(s); }); }
    else chosen.forEach(function(c){ addHabit({name:c.name,icon:c.icon}); });
    if(obData.name) S.name=obData.name; S.reminderTime=obData.time||"08:00"; S.reminders=true; S.started=true; save();
  }
  /* Delegated handler for onboarding nav actions — attached once to #main, survives every
     re-render since #main itself is never replaced, only its innerHTML. This avoids any
     issue with re-finding freshly injected buttons by id after each step change. */
  if(!window._obDelegated){
    window._obDelegated=true;
    document.getElementById("main").addEventListener("click", function(e){
      var b=e.target.closest("[data-obact]"); if(!b) return;
      var act=b.dataset.obact;
      var nmI=document.getElementById("obName"), cuI=document.getElementById("obCustom"), tiI=document.getElementById("obTime");
      if(nmI) obData.name=nmI.value.trim();
      if(cuI) obData.custom=cuI.value;
      if(tiI) obData.time=tiI.value||"08:00";
      if(act==="next"){
        if(obStep===0 && !obData.name){ toast("Tell me what to call you first 🙂"); if(nmI) nmI.focus(); return; }
        if(obStep===0){ S.name=obData.name; save(); }
        obStep=Math.min(4,obStep+1); window.scrollTo(0,0); render(); }
      else if(act==="back"){ obStep=Math.max(0,obStep-1); render(); }
      else if(act==="skip"){ STARTERS.forEach(function(s){ addHabit(s); }); S.started=true; save(); tab="today"; render(); }
      else if(act==="go"){
        obStep=5; render();
        setTimeout(function(){ buildPlanFromOb(); obStep=0; tab="today"; render();
          celebrate("🌱","Your plan is ready"+(S.name?", "+S.name:"")+"!","I picked habits from what you told me. Tick them off as you go, and I'll cheer you on."); },1100);
      }
    });
  }
  if(q("favTip")) q("favTip").onclick=function(){ var t=tipOfDay()[1]; var i=S.favTips.indexOf(t);
    if(i>=0) S.favTips.splice(i,1); else S.favTips.push(t); save(); render(); };
  if(q("favTip2")) q("favTip2").onclick=function(){ var t=tipOfDay()[1]; var i=S.favTips.indexOf(t);
    if(i>=0) S.favTips.splice(i,1); else S.favTips.push(t); save(); render(); };
  if(q("nFreq")) { q("nFreq").onchange=freqExtra; freqExtra(); }
  if(q("createHabit")) q("createHabit").onclick=function(){
    var n=q("nName").value.trim(); if(!n){ toast("Give it a name first"); return; }
    var f=q("nFreq").value;
    var obj={name:n, icon:q("nIcon").value||"⭐", cat:q("nCat").value, freq:f,
      target:Math.max(1,Number(q("nTarget").value)||1), start:q("nStart").value||today(), note:q("nNote").value.trim(),
      time:q("nTime").value||""};
    if(f==="days") obj.days=pickedDays();
    if(f==="week") obj.perWeek=Number((q("nPer")||{}).value||3);
    addHabit(obj); toast("Habit added"); tab="today"; render();
  };
  if(q("saveWater")) q("saveWater").onclick=function(){ S.waterGoal=Math.max(1,Number(q("wGoal").value)||8); save(); render(); toast("Saved"); };
  if(q("logEx")) q("logEx").onclick=function(){
    S.exercise.push({id:uid(),kind:q("eKind").value,minutes:Math.max(1,Number(q("eMin").value)||0),
      date:q("eDate").value||today(),note:q("eNote").value.trim()});
    save(); render(); toast("Session saved"); checkBadges(); };
  if(q("saveEGoal")) q("saveEGoal").onclick=function(){ S.exerciseGoal=Math.max(10,Number(q("eGoal").value)||150); save(); render(); toast("Goal saved"); };
  if(q("saveName")) q("saveName").onclick=function(){ S.name=q("sName").value.trim(); save(); render(); toast("Saved"); };
  if(q("sugSend")) q("sugSend").onclick=function(){
    var t=q("sugText").value.trim(); if(!t){ toast("Write a message first"); return; }
    sendSuggestion(t, q("sugName").value.trim()); q("sugText").value=""; q("sugName").value=""; };
  if(q("adminBtn")) q("adminBtn").onclick=function(){ tab="admin"; render(); };
  if(q("adminBack")) q("adminBack").onclick=function(){ tab="settings"; render(); };
  if(q("signOutBtn")) q("signOutBtn").onclick=function(){
    busy("signOutBtn",true);
    cloudWrite().then(unregisterPush).then(function(){
      var em=fbUser&&fbUser.email, dv=S.deviceId, th=S.theme;
      forgetKey(em); S=JSON.parse(JSON.stringify(DEFAULTS)); S.deviceId=dv; S.theme=th; saveLocal();
      obStep=0; tab="today"; return fbAuth.signOut();
    }).catch(function(){ busy("signOutBtn",false); }); };
  if(q("addAdminBtn")) q("addAdminBtn").onclick=function(){
    var em=(q("newAdminEmail").value||"").trim().toLowerCase(); if(!em){ toast("Enter an email"); return; }
    fbDb.collection("admins").doc(em).set({addedBy:fbUser.email,addedAt:new Date().toISOString()})
      .then(function(){ toast("Admin added: "+em); q("newAdminEmail").value=""; })
      .catch(function(){ toast("Could not add admin"); }); };
  if(q("annSend")) q("annSend").onclick=function(){
    var t=q("annText").value.trim(); if(!t){ toast("Write something first"); return; }
    fbDb.collection("announcements").doc("current").set({text:t,date:new Date().toISOString()})
      .then(function(){ toast("Posted"); }).catch(function(){ toast("Could not post"); }); };
  if(q("annClear")) q("annClear").onclick=function(){
    fbDb.collection("announcements").doc("current").delete()
      .then(function(){ toast("Cleared"); }).catch(function(){ toast("Could not clear"); }); };
  if(tab==="admin" && fbIsAdmin && fbDb){ loadAdminData(); loadAdminStats(); }
  if(q("installBtn2")) q("installBtn2").onclick=function(){ document.getElementById("installBtn").click(); };
  if(q("remOn")) q("remOn").onclick=function(){ S.reminders=true; save(); render(); };
  if(q("remOff")) q("remOff").onclick=function(){ S.reminders=false; save(); render(); };
  if(q("saveRem")) q("saveRem").onclick=function(){ S.reminderTime=q("remTime").value||"08:00"; save(); toast("Reminder set for "+S.reminderTime); };
  if(q("permBtn")) q("permBtn").onclick=function(){
    if(!("Notification" in window)){ toast(/iPhone|iPad/.test(navigator.userAgent)? "On iPhone, first add this app to your Home Screen, then open it from there." : "This browser can't show notifications."); return; }
    Notification.requestPermission().then(function(p){
      if(p!=="granted"){ toast("Notifications are blocked. You can allow them in your phone's settings."); return; }
      if(!pushConfigured()){ toast("Notifications allowed"); return; }
      toast("Setting up alarms on this phone…");
      syncPush(true).then(function(ok){ toast(ok? "✅ Alarms are on. They'll arrive even when the app is closed." : "Couldn't switch on alarms right now. Try again when online."); render(); });
    }); };
  if(q("expJson")) q("expJson").onclick=exportJson;
  if(q("expCsv")) q("expCsv").onclick=exportCsv;
  if(q("importBtn")) q("importBtn").onclick=function(){ q("fileIn").click(); };
  if(q("fileIn")) q("fileIn").onchange=function(e){
    var f=e.target.files[0]; if(!f) return; var r=new FileReader();
    r.onload=function(){ try{ var o=JSON.parse(r.result); S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),o); save(); render(); toast("Imported"); }
      catch(err){ toast("That file could not be read"); } };
    r.readAsText(f); };
  if(q("wipe")) q("wipe").onclick=function(){
    openDialog('<h2>Erase everything?</h2><p class="small">This removes all habits, water, exercise, badges and settings from this device. It cannot be undone.</p>'+
      '<div class="row" style="margin-top:14px"><button class="btn" onclick="closeDialog()">Cancel</button>'+
      '<button class="btn primary" id="wipeYes">Yes, erase</button></div>');
    document.getElementById("wipeYes").onclick=function(){
      localStorage.removeItem(KEY); S=load();
      if(!S.deviceId) S.deviceId=uid()+uid();
      save(); closeDialog(); tab=S.started?"today":"onboard"; render(); toast("Erased"); }; };
}
function freqExtra(){
  var v=document.getElementById("nFreq").value, box=document.getElementById("freqExtra");
  if(v==="days"){ box.innerHTML='<label class="f">Which days</label><div class="switch" id="dayPick">'+
    DAYN.map(function(d,i){return '<button type="button" data-day="'+i+'">'+d+'</button>';}).join("")+'</div>';
    box.querySelectorAll("[data-day]").forEach(function(b){ b.onclick=function(){ b.classList.toggle("on"); }; });
  } else if(v==="week"){ box.innerHTML='<label class="f">Times per week</label><input id="nPer" type="number" min="1" max="7" value="3" />';
  } else box.innerHTML="";
}
function pickedDays(){
  var out=[]; document.querySelectorAll("#dayPick .on").forEach(function(b){ out.push(Number(b.dataset.day)); });
  return out.length?out:[1,2,3,4,5];
}
function find(id){ for(var i=0;i<S.habits.length;i++) if(S.habits[i].id===id) return S.habits[i]; return null; }
function addHabit(o){
  S.habits.push({id:uid(), name:o.name, icon:o.icon||"⭐", cat:o.cat||"health", freq:o.freq||"daily",
    days:o.days||null, perWeek:o.perWeek||null, target:o.target||1, note:o.note||"", time:o.time||"",
    start:o.start||today(), order:S.habits.length, archived:false});
  save();
}
function move(id,dir){
  var list=activeHabits(), i=list.findIndex(function(x){return x.id===id;});
  var j=i+dir; if(j<0||j>=list.length) return;
  var a=list[i].order||i, b=list[j].order||j;
  list[i].order=b; list[j].order=a;
  list.forEach(function(x,k){ if(x.order===undefined) x.order=k; });
  save(); render();
}
function editHabit(h){
  openDialog('<h2>Edit habit</h2>'+
    '<label class="f">Name</label><input id="eN" value="'+esc(h.name)+'" />'+
    '<label class="f">Icon</label><input id="eI" value="'+esc(h.icon||"")+'" />'+
    '<label class="f">Note</label><textarea id="eNo">'+esc(h.note||"")+'</textarea>'+
    '<label class="f">Daily target</label><input id="eT" type="number" min="1" value="'+(h.target||1)+'" />'+
    '<label class="f">Remind me at (optional)</label><input id="eTime" type="time" value="'+(h.time||"")+'" />'+
    '<div class="row" style="margin-top:14px"><button class="btn" onclick="closeDialog()">Cancel</button>'+
    '<button class="btn primary" id="eSave">Save</button>'+
    '<button class="btn" id="eArch">Archive</button><button class="btn" id="eDel">Delete</button></div>');
  document.getElementById("eSave").onclick=function(){
    h.name=document.getElementById("eN").value.trim()||h.name;
    h.icon=document.getElementById("eI").value;
    h.note=document.getElementById("eNo").value.trim();
    h.target=Math.max(1,Number(document.getElementById("eT").value)||1);
    h.time=document.getElementById("eTime").value||"";
    save(); closeDialog(); render(); };
  document.getElementById("eArch").onclick=function(){ h.archived=true; save(); closeDialog(); render(); };
  document.getElementById("eDel").onclick=function(){
    S.habits=S.habits.filter(function(x){return x.id!==h.id;}); save(); closeDialog(); render(); };
}
function pastDays(h){
  var rows='';
  for(var i=1;i<=14;i++){ var d=addDays(today(),-i);
    rows+='<div class="item row"><span style="flex:1">'+d+' · '+DAYN[weekdayOf(d)]+'</span>'+
      '<button class="btn sm" data-mark="'+d+'">'+(isDone(h,d)?"✓ done":"mark done")+'</button></div>'; }
  openDialog('<h2>'+esc(h.name)+'</h2><p class="small">Tick a day you forgot to mark.</p><div class="list">'+rows+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn primary" onclick="closeDialog()">Close</button></div>');
  document.querySelectorAll("[data-mark]").forEach(function(b){ b.onclick=function(){
    var d=b.dataset.mark; setDone(h,d,!isDone(h,d)); b.textContent=isDone(h,d)?"✓ done":"mark done"; }; });
}

/* ---------- export ---------- */
function download(name,text,type){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:type}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportJson(){ download("ese-habit-data-"+today()+".json", JSON.stringify(S,null,2),"application/json"); }
function exportCsv(){
  var rows=[["habit","date","status"]];
  S.habits.forEach(function(h){
    Object.keys(S.done[h.id]||{}).forEach(function(d){ rows.push([h.name,d,"done"]); });
    Object.keys(S.skips[h.id]||{}).forEach(function(d){ rows.push([h.name,d,"skipped"]); });
  });
  Object.keys(S.water).forEach(function(d){ rows.push(["Water ("+S.waterUnit+")",d,S.water[d]]); });
  S.exercise.forEach(function(e){ rows.push(["Exercise: "+e.kind,e.date,e.minutes+" min"]); });
  var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\n");
  download("ese-habit-data-"+today()+".csv",csv,"text/csv");
}

/* ---------- reminders (while the page is open; a service worker keeps the app shell offline, but real background push still needs the tab open) ---------- */
function notify(title,body){
  toast(body);
  try{ if(!("Notification" in window) || Notification.permission!=="granted") return;
    var opts={body:body, tag:"ese-"+title, renotify:true, requireInteraction:true, vibrate:[400,150,400,150,400]};
    if("serviceWorker" in navigator && navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(function(r){ return r.showNotification(title,opts); })
        .catch(function(){ try{ new Notification(title,opts); }catch(e){} });
    } else new Notification(title,opts);
  }catch(e){}
}
var firedToday={};
try{ firedToday=JSON.parse(localStorage.getItem("ese.fired")||"{}")||{}; }catch(e){ firedToday={}; }
function markFired(k){ firedToday[k]=1;
  var keep={}, t=today(); Object.keys(firedToday).forEach(function(x){ if(x.indexOf(t)===0) keep[x]=1; });
  firedToday=keep; try{ localStorage.setItem("ese.fired",JSON.stringify(firedToday)); }catch(e){} }
/* Minutes since an HH:MM time today (negative = still to come). Alarms ring on time and,
   if the phone slept through the exact minute, up to 10 minutes late — never hours late. */
function minsSince(hhmm){ var p=String(hhmm||"").split(":"); if(p.length<2) return null;
  var t=new Date(); t.setHours(+p[0],+p[1],0,0); return Math.floor((Date.now()-t.getTime())/60000); }
function dueNow(hhmm){ var m=minsSince(hhmm); return m!==null && m>=0 && m<=10; }
function checkAlarms(){
  if(!S.reminders || !S.started) return;
  var d=today(), p=dayProgress(d);
  if(dueNow(S.reminderTime||"08:00") && !firedToday[d+"a"]){
    markFired(d+"a"); notify((new Date().getHours()<12?"Good morning":"Hi")+(S.name?", "+S.name:"")+" ☀️", companionMessage());
    notify("🗣️ Today's declaration", todaysAffirmation());
    notify("💡 Today's health tip", tipOfDay()[1]);
  }
  if(dueNow("18:00") && S.showSteps!==false && stepsToday()<(S.stepGoal||8000) && !firedToday[d+"s"]){
    markFired(d+"s"); notify("👟 Step check", "You're at "+stepsToday().toLocaleString()+" steps. A short walk gets you closer to "+(S.stepGoal||8000).toLocaleString()+".");
  }
  if(dueNow("19:30") && p.total && p.done<p.total && !firedToday[d+"b"]){
    markFired(d+"b"); notify("A gentle nudge", "Still time for one habit today. "+pick(PUSH));
  }
  /* per-habit alarms: an hour before, and right at the time */
  activeHabits().forEach(function(h){
    if(!h.time || !dueOn(h,d) || isSatisfied(h,d)) return;
    var m=minsSince(h.time); if(m===null) return;
    if(m>=-60 && m<=-50 && !firedToday[d+h.id+"h1"]){ markFired(d+h.id+"h1"); notify("⏰ Coming up in an hour", h.name); }
    if(m>=0 && m<=10 && !firedToday[d+h.id+"now"]){ markFired(d+h.id+"now"); notify("⏰ Time for: "+h.name, "Your friendly nudge — you've got this."); }
  });
}
/* Line the checks up with the start of each minute so alarms ring at :00, not up to 30s late. */
function alarmLoop(){ try{ checkAlarms(); }catch(e){} setTimeout(alarmLoop, 60000-(Date.now()%60000)+300); }
setTimeout(alarmLoop, 60000-(Date.now()%60000)+300);
setInterval(function(){ try{ checkAlarms(); }catch(e){} },15000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden){ try{ checkAlarms(); }catch(e){} applyPhoneSteps(); } });
window.addEventListener("focus",function(){ try{ checkAlarms(); }catch(e){} });

/* ---------- first run ---------- */
function boot(){
  if(!S.deviceId){ S.deviceId=uid()+uid(); saveLocal(); }
  applyTheme();
  if(fbReady()){
    appPhase="loading";
    render();
    fbInit();
  } else {
    appPhase="app";
    if(!S.started){ tab="onboard"; }
    var last=S.lastOpen; S.lastOpen=today(); saveLocal();
    render();
    if(S.started && last!==today()) setTimeout(function(){ toast(companionMessage()); },700);
  }
}
window.closeDialog=closeDialog;
boot();
</script>
